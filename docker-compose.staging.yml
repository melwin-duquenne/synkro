services:
  backend-fpm:
    image: moignon/synkro-backend:staging
    container_name: synkro_staging_backend_fpm
    restart: always
    mem_limit: 512m
    cpus: 0.75
    environment:
      APP_ENV: prod
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-synkro:5432/${POSTGRES_DB}?serverVersion=16&charset=utf8
      JWT_SECRET_KEY: "%kernel.project_dir%/config/jwt/private.pem"
      JWT_PUBLIC_KEY: "%kernel.project_dir%/config/jwt/public.pem"
      JWT_PASSPHRASE: ${JWT_PASSPHRASE}
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      MAILER_DSN: ${MAILER_DSN}
      MAILER_FROM: ${MAILER_FROM}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL}
    volumes:
      - backend_public_staging:/var/www/public
      - ./backend/config/jwt:/var/www/config/jwt:ro
      - ./.env:/var/www/.env:ro
    depends_on:
      - postgres-synkro
    networks:
      - synkronet-staging

  backend-synkro:
    image: nginx:1.27-alpine
    container_name: synkro_staging_backend_nginx
    restart: always
    mem_limit: 128m
    cpus: 0.25
    volumes:
      - ./backend/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - backend_public_staging:/var/www/public:ro
    depends_on:
      - backend-fpm
    networks:
      - synkronet-staging

  frontend-synkro:
    image: moignon/synkro-frontend:staging
    container_name: synkro_staging_frontend
    restart: always
    mem_limit: 128m
    cpus: 0.25
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      - backend-synkro
      - websocket-synkro
    networks:
      - synkronet-staging

  websocket-synkro:
    image: moignon/synkro-websocket:staging
    container_name: synkro_staging_websocket
    restart: always
    mem_limit: 256m
    cpus: 0.5
    ports:
      - "127.0.0.1:3002:3001"
    environment:
      NODE_ENV: production
      PORT: "3001"
      BACKEND_INTERNAL_URL: "http://backend-synkro:8000"
    networks:
      - synkronet-staging

  postgres-synkro:
    image: postgres:16
    container_name: synkro_staging_postgres
    restart: always
    mem_limit: 512m
    cpus: 0.5
    volumes:
      - postgres_data_staging:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    networks:
      - synkronet-staging

volumes:
  postgres_data_staging:
  backend_public_staging:

networks:
  synkronet-staging:
    driver: bridge
