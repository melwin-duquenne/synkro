[defaults]
inventory = inventory.ini
host_key_checking = False
retry_files_enabled = False
stdout_callback = yaml
forks = 10
roles_path = ./roles
interpreter_python = auto_silent
deprecation_warnings = False

[ssh_connection]
pipelining = True
# IdentitiesOnly : ne proposer que la clé de déploiement (évite les "Failed publickey"
# qui font bannir le runner par fail2ban). ControlPersist : 1 connexion réutilisée.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=30 -o IdentitiesOnly=yes
