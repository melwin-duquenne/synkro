---
# ===========================================================================
# SETUP INITIAL DU VPS — À lancer une seule fois (ou pour reconfigurer)
# Usage: ansible-playbook ansible/setup.yml -i ansible/inventory.ini
# ===========================================================================
- name: Setup initial VPS Synkro
  hosts: vps
  become: yes

  vars:
    app_dir: /opt/synkro
    domain: synkro.ovh
    certbot_email: admin@synkro.ovh
    backup_dir: /opt/synkro-backups

  pre_tasks:
    - name: Vérifier que .env existe en local
      delegate_to: localhost
      become: no
      stat:
        path: ../.env
      register: env_file
      failed_when: not env_file.stat.exists

  tasks:
    # ═══════════════════════════════════════════════════════════════════════
    # SYSTÈME
    # ═══════════════════════════════════════════════════════════════════════
    - name: Mise à jour du système
      apt:
        update_cache: yes
        upgrade: dist
        cache_valid_time: 3600

    - name: Installation des dépendances
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - software-properties-common
          - openssl
          - nginx
          - certbot
          - python3-certbot-nginx
          - lsof
          - logrotate
          - ufw
        state: present

    # ═══════════════════════════════════════════════════════════════════════
    # DOCKER
    # ═══════════════════════════════════════════════════════════════════════
    - name: Installation de Docker
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
      ignore_errors: yes

    - name: Démarrer Docker
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Configurer la rotation des logs Docker
      copy:
        content: |
          {
            "log-driver": "json-file",
            "log-opts": {
              "max-size": "10m",
              "max-file": "5"
            }
          }
        dest: /etc/docker/daemon.json
      notify: Redémarrer Docker

    # ═══════════════════════════════════════════════════════════════════════
    # SÉCURITÉ
    # ═══════════════════════════════════════════════════════════════════════
    - name: Désactiver l'authentification SSH par mot de passe
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PasswordAuthentication'
        line: 'PasswordAuthentication no'
      notify: Redémarrer SSH

    - name: Configurer UFW
      ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop:
        - '22'
        - '80'
        - '443'

    - name: Activer UFW
      ufw:
        state: enabled
        policy: deny

    # ═══════════════════════════════════════════════════════════════════════
    # RÉPERTOIRES & FICHIERS
    # ═══════════════════════════════════════════════════════════════════════
    - name: Créer les répertoires
      file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ app_dir }}"
        - "{{ app_dir }}/backend/docker"
        - "{{ app_dir }}/backend/config/jwt"
        - "{{ backup_dir }}"

    - name: Copier docker-compose.deploiement.yml
      copy:
        src: ../docker-compose.deploiement.yml
        dest: "{{ app_dir }}/docker-compose.deploiement.yml"

    - name: Copier le fichier .env
      copy:
        src: ../.env
        dest: "{{ app_dir }}/.env"
        mode: '0644'

    - name: Copier le nginx.conf du backend
      copy:
        src: ../backend/docker/nginx.conf
        dest: "{{ app_dir }}/backend/docker/nginx.conf"

    # ═══════════════════════════════════════════════════════════════════════
    # CLÉS JWT — générées sur l'hôte avec openssl
    # ═══════════════════════════════════════════════════════════════════════
    - name: Lire la passphrase JWT depuis le .env
      shell: grep '^JWT_PASSPHRASE=' {{ app_dir }}/.env | cut -d'=' -f2-
      register: jwt_passphrase_raw
      changed_when: false

    - name: Vérifier si les clés JWT existent
      stat:
        path: "{{ app_dir }}/backend/config/jwt/private.pem"
      register: jwt_private_key

    - name: Générer la clé privée JWT (RSA 4096 avec passphrase)
      shell: >
        openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096
        -aes-256-cbc -pass pass:{{ jwt_passphrase_raw.stdout | quote }}
        -out {{ app_dir }}/backend/config/jwt/private.pem
      when: not jwt_private_key.stat.exists and jwt_passphrase_raw.stdout | length > 0

    - name: Générer la clé privée JWT (RSA 4096 sans passphrase)
      shell: >
        openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096
        -out {{ app_dir }}/backend/config/jwt/private.pem
      when: not jwt_private_key.stat.exists and jwt_passphrase_raw.stdout | length == 0

    - name: Générer la clé publique JWT
      shell: >
        openssl rsa
        -in {{ app_dir }}/backend/config/jwt/private.pem
        -pubout -out {{ app_dir }}/backend/config/jwt/public.pem
        {% if jwt_passphrase_raw.stdout | length > 0 %}-passin pass:{{ jwt_passphrase_raw.stdout | quote }}{% endif %}
      when: not jwt_private_key.stat.exists

    - name: Permissions sur les clés JWT
      file:
        path: "{{ item }}"
        mode: '0644'
      loop:
        - "{{ app_dir }}/backend/config/jwt/private.pem"
        - "{{ app_dir }}/backend/config/jwt/public.pem"

    # ═══════════════════════════════════════════════════════════════════════
    # DÉMARRAGE INITIAL
    # ═══════════════════════════════════════════════════════════════════════
    - name: Puller les images
      shell: >
        docker compose --env-file {{ app_dir }}/.env
        -f {{ app_dir }}/docker-compose.deploiement.yml pull

    - name: Démarrer les conteneurs
      shell: >
        docker compose --env-file {{ app_dir }}/.env
        -f {{ app_dir }}/docker-compose.deploiement.yml up -d --remove-orphans

    - name: Attendre que PostgreSQL soit prêt
      shell: >
        docker compose --env-file {{ app_dir }}/.env
        -f {{ app_dir }}/docker-compose.deploiement.yml
        exec -T postgres-synkro pg_isready
      retries: 15
      delay: 3
      register: pg_ready
      until: pg_ready.rc == 0

    - name: Lancer les migrations Doctrine
      shell: >
        docker compose --env-file {{ app_dir }}/.env
        -f {{ app_dir }}/docker-compose.deploiement.yml
        exec -T backend-fpm php bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration
      register: migrations

    - name: Résultat des migrations
      debug:
        msg: "{{ migrations.stdout_lines }}"

    # ═══════════════════════════════════════════════════════════════════════
    # NGINX HÔTE + SSL
    # ═══════════════════════════════════════════════════════════════════════
    - name: Supprimer les configs Nginx par défaut
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/nginx/sites-enabled/default
        - /etc/nginx/sites-enabled/app.conf
        - /etc/nginx/sites-available/app.conf

    - name: Créer le répertoire Certbot
      file:
        path: /var/www/certbot
        state: directory
        mode: '0755'

    - name: Config Nginx — HTTP (pour Certbot)
      copy:
        content: |
          server {
              listen 80;
              server_name {{ domain }} www.{{ domain }};

              location /.well-known/acme-challenge/ {
                  root /var/www/certbot;
              }

              location / {
                  proxy_pass http://127.0.0.1:8080;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto http;
              }
          }
        dest: /etc/nginx/sites-available/synkro

    - name: Activer le vhost
      file:
        src: /etc/nginx/sites-available/synkro
        dest: /etc/nginx/sites-enabled/synkro
        state: link

    - name: Tester et démarrer Nginx
      shell: nginx -t && systemctl restart nginx

    - name: Générer le certificat SSL
      shell: |
        certbot certonly --webroot -w /var/www/certbot \
          -d {{ domain }} -d www.{{ domain }} \
          --email {{ certbot_email }} \
          --agree-tos --non-interactive || true

    - name: Vérifier le certificat
      stat:
        path: /etc/letsencrypt/live/{{ domain }}/fullchain.pem
      register: cert_stat

    # ═══════════════════════════════════════════════════════════════════════
    # FINALISATION
    # ═══════════════════════════════════════════════════════════════════════
    - name: Recharger Nginx
      shell: nginx -t && systemctl restart nginx

    - name: Cron de renouvellement SSL
      cron:
        name: "Certbot renewal"
        minute: "0"
        hour: "3"
        weekday: "1"
        job: "certbot renew --quiet --post-hook 'systemctl reload nginx'"

    - name: Résumé
      debug:
        msg:
          - "PostgreSQL: OK"
          - "Migrations: {{ 'OK' if migrations.rc == 0 else 'ERREUR' }}"
          - "JWT Keys: {{ 'existantes' if jwt_private_key.stat.exists else 'générées' }}"
          - "SSL: {{ 'OK' if cert_stat.stat.exists else 'pas de certificat' }}"

  handlers:
    - name: Redémarrer SSH
      service:
        name: sshd
        state: restarted

    - name: Redémarrer Docker
      systemd:
        name: docker
        state: restarted

# Appliquer la sécurité après le setup
- import_playbook: security.yml
