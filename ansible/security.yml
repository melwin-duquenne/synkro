---
# ===========================================================================
# SÉCURITÉ VPS — ModSecurity, Fail2ban, headers, rate limiting
# Appelé par deploy.yml ou exécutable séparément :
#   ansible-playbook ansible/security.yml -i ansible/inventory.ini
# ===========================================================================
- name: Sécurisation VPS Synkro
  hosts: vps
  become: yes

  vars:
    domain: synkro.ovh

  tasks:
    # ═══════════════════════════════════════════════════════════════════════
    # FAIL2BAN
    # ═══════════════════════════════════════════════════════════════════════
    - name: Installer fail2ban
      apt:
        name: fail2ban
        state: present
        update_cache: yes

    - name: Configuration fail2ban — défaut
      copy:
        content: |
          [DEFAULT]
          bantime = 1h
          findtime = 10m
          maxretry = 5
          banaction = ufw
          ignoreip = 127.0.0.1/8 ::1

          [sshd]
          enabled = true
          port = ssh
          filter = sshd
          logpath = /var/log/auth.log
          maxretry = 3
          bantime = 24h
        dest: /etc/fail2ban/jail.local
        mode: '0644'
      notify: Redémarrer fail2ban

    - name: Configuration fail2ban — Nginx HTTP Auth
      copy:
        content: |
          [nginx-http-auth]
          enabled = true
          port = http,https
          filter = nginx-http-auth
          logpath = /var/log/nginx/error.log
          maxretry = 5
          bantime = 1h
        dest: /etc/fail2ban/jail.d/nginx-http-auth.conf
        mode: '0644'
      notify: Redémarrer fail2ban

    - name: Configuration fail2ban — Nginx rate limit
      copy:
        content: |
          [nginx-limit-req]
          enabled = true
          port = http,https
          filter = nginx-limit-req
          logpath = /var/log/nginx/error.log
          maxretry = 10
          findtime = 1m
          bantime = 1h
        dest: /etc/fail2ban/jail.d/nginx-limit-req.conf
        mode: '0644'
      notify: Redémarrer fail2ban

    - name: Filtre fail2ban — Tentatives de login API
      copy:
        content: |
          [Definition]
          failregex = ^<HOST> .* "POST /api/auth/login HTTP.*" 401
          ignoreregex =
        dest: /etc/fail2ban/filter.d/synkro-login.conf
        mode: '0644'
      notify: Redémarrer fail2ban

    - name: Configuration fail2ban — Login API bruteforce
      copy:
        content: |
          [synkro-login]
          enabled = true
          port = http,https
          filter = synkro-login
          logpath = /var/log/nginx/access.log
          maxretry = 5
          findtime = 5m
          bantime = 30m
        dest: /etc/fail2ban/jail.d/synkro-login.conf
        mode: '0644'
      notify: Redémarrer fail2ban

    - name: Filtre fail2ban — ModSecurity blocks
      copy:
        content: |
          [Definition]
          failregex = \[client <HOST>\] ModSecurity: Access denied
          ignoreregex =
        dest: /etc/fail2ban/filter.d/modsecurity.conf
        mode: '0644'
      notify: Redémarrer fail2ban

    - name: Configuration fail2ban — ModSecurity
      copy:
        content: |
          [modsecurity]
          enabled = true
          port = http,https
          filter = modsecurity
          logpath = /var/log/nginx/error.log
          maxretry = 3
          findtime = 5m
          bantime = 2h
        dest: /etc/fail2ban/jail.d/modsecurity.conf
        mode: '0644'
      notify: Redémarrer fail2ban

    - name: Démarrer fail2ban
      systemd:
        name: fail2ban
        state: started
        enabled: yes

    # ═══════════════════════════════════════════════════════════════════════
    # MODSECURITY — OWASP CRS
    # ═══════════════════════════════════════════════════════════════════════
    - name: Vérifier la présence de ModSecurity
      stat:
        path: /etc/nginx/modsec/crs/crs-setup.conf
      register: crs_setup

    - name: Vérifier si le bloc content-type est déjà décommenté
      shell: grep -P '^\s*SecAction' /etc/nginx/modsec/crs/crs-setup.conf | grep -q "900220"
      register: crs_content_type_active
      failed_when: false
      changed_when: false
      when: crs_setup.stat.exists

    - name: Décommenter le bloc SecAction pour les content-types API Platform
      shell: |
        LINE=$(grep -n "allowed_request_content_type=" /etc/nginx/modsec/crs/crs-setup.conf | head -1 | cut -d: -f1)
        if [ -n "$LINE" ]; then
          START=$((LINE - 8))
          sed -i "${START},${LINE} s/^#//" /etc/nginx/modsec/crs/crs-setup.conf
        fi
      when:
        - crs_setup.stat.exists
        - crs_content_type_active.rc != 0

    - name: S'assurer que ld+json est dans les content-types autorisés
      shell: |
        if grep "allowed_request_content_type=" /etc/nginx/modsec/crs/crs-setup.conf | grep -v "^#" | grep -q "ld+json"; then
          echo "already present"
        else
          sed -i '/allowed_request_content_type=/ { /^#/!s/|application\/json|/|application\/json| |application\/ld+json| |application\/merge-patch+json|/ }' /etc/nginx/modsec/crs/crs-setup.conf
        fi
      when: crs_setup.stat.exists

    - name: Avertir si ModSecurity est absent
      debug:
        msg: "INFO : ModSecurity non installé — WAF désactivé."
      when: not crs_setup.stat.exists

    # ═══════════════════════════════════════════════════════════════════════
    # NGINX — RATE LIMITING & SECURITY HEADERS
    # ═══════════════════════════════════════════════════════════════════════
    - name: Config Nginx — Rate limiting et headers de sécurité
      copy:
        content: |
          # Rate limiting zones
          limit_req_zone $binary_remote_addr zone=api_login:10m rate=5r/m;
          limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
          limit_req_zone $binary_remote_addr zone=api_register:10m rate=3r/m;

          # Taille max des requêtes (uploads)
          client_max_body_size 50m;

          # Timeouts
          proxy_connect_timeout 10s;
          proxy_read_timeout 30s;
          proxy_send_timeout 30s;

          # Masquer la version Nginx
          server_tokens off;
        dest: /etc/nginx/conf.d/security.conf
        mode: '0644'
      notify: Recharger Nginx

    - name: Vérifier le certificat SSL
      stat:
        path: /etc/letsencrypt/live/{{ domain }}/fullchain.pem
      register: cert_stat

    - name: Config Nginx — vhost sécurisé
      copy:
        content: |
          server {
              listen 80;
              server_name {{ domain }} www.{{ domain }};
              return 301 https://$host$request_uri;
          }

          server {
              listen 443 ssl http2;
              server_name {{ domain }} www.{{ domain }};

              # SSL
              ssl_certificate /etc/letsencrypt/live/{{ domain }}/fullchain.pem;
              ssl_certificate_key /etc/letsencrypt/live/{{ domain }}/privkey.pem;
              ssl_protocols TLSv1.2 TLSv1.3;
              ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
              ssl_prefer_server_ciphers on;
              ssl_session_cache shared:SSL:10m;
              ssl_session_timeout 10m;
              ssl_stapling on;
              ssl_stapling_verify on;

              # Security headers
              add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
              add_header X-Frame-Options DENY always;
              add_header X-Content-Type-Options nosniff always;
              add_header X-XSS-Protection "1; mode=block" always;
              add_header Referrer-Policy "strict-origin-when-cross-origin" always;
              add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

              # Bloquer les scanners et bots malveillants
              if ($http_user_agent ~* (sqlmap|nikto|nessus|havij|w3af)) {
                  return 403;
              }

              # Frontend
              location / {
                  proxy_pass http://127.0.0.1:8080;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto https;
              }

              # API — rate limiting général
              location /api/ {
                  limit_req zone=api_general burst=50 nodelay;

                  proxy_pass http://127.0.0.1:8080;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto https;
              }

              # Login — rate limiting strict
              location = /api/auth/login {
                  limit_req zone=api_login burst=3 nodelay;
                  limit_req_status 429;

                  proxy_pass http://127.0.0.1:8080;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto https;
              }

              # Register — rate limiting strict
              location = /api/auth/register {
                  limit_req zone=api_register burst=2 nodelay;
                  limit_req_status 429;

                  proxy_pass http://127.0.0.1:8080;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto https;
              }

              # WebSocket
              location /ws {
                  proxy_pass http://127.0.0.1:3001;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection "upgrade";
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto https;
                  proxy_read_timeout 86400;
              }

              # Bloquer l'accès aux fichiers sensibles
              location ~ /\.(env|git|htaccess|htpasswd) {
                  deny all;
                  return 404;
              }
          }
        dest: /etc/nginx/sites-available/synkro
      when: cert_stat.stat.exists
      notify: Recharger Nginx

    - name: Config Nginx — status.{{ domain }} (Uptime Kuma)
      copy:
        content: |
          server {
              listen 80;
              server_name status.{{ domain }};
              return 301 https://$host$request_uri;
          }

          server {
              listen 443 ssl http2;
              server_name status.{{ domain }};

              ssl_certificate /etc/letsencrypt/live/{{ domain }}/fullchain.pem;
              ssl_certificate_key /etc/letsencrypt/live/{{ domain }}/privkey.pem;

              auth_basic "Monitoring";
              auth_basic_user_file /etc/nginx/.htpasswd_monitoring;

              location / {
                  proxy_pass http://127.0.0.1:3100;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto https;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection "upgrade";
              }
          }
        dest: /etc/nginx/sites-available/synkro-kuma
      notify: Recharger Nginx

    - name: Config Nginx — netdata.{{ domain }} (Netdata)
      copy:
        content: |
          server {
              listen 80;
              server_name netdata.{{ domain }};
              return 301 https://$host$request_uri;
          }

          server {
              listen 443 ssl http2;
              server_name netdata.{{ domain }};

              ssl_certificate /etc/letsencrypt/live/{{ domain }}/fullchain.pem;
              ssl_certificate_key /etc/letsencrypt/live/{{ domain }}/privkey.pem;

              auth_basic "Monitoring";
              auth_basic_user_file /etc/nginx/.htpasswd_monitoring;

              location / {
                  proxy_pass http://127.0.0.1:9100;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto https;
              }
          }
        dest: /etc/nginx/sites-available/synkro-netdata
      notify: Recharger Nginx

    - name: Activer les vhosts monitoring
      file:
        src: "/etc/nginx/sites-available/{{ item }}"
        dest: "/etc/nginx/sites-enabled/{{ item }}"
        state: link
      loop:
        - synkro-kuma
        - synkro-netdata
      notify: Recharger Nginx

    - name: Générer les certificats SSL pour les sous-domaines monitoring
      shell: |
        certbot certonly --webroot -w /var/www/certbot \
          -d status.{{ domain }} -d netdata.{{ domain }} \
          --email admin@{{ domain }} \
          --agree-tos --non-interactive || true
      register: certbot_monitoring

    - name: Vérifier le certificat monitoring
      stat:
        path: /etc/letsencrypt/live/status.{{ domain }}/fullchain.pem
      register: cert_monitoring

    - name: Mettre à jour les vhosts avec les certificats dédiés
      replace:
        path: "/etc/nginx/sites-available/{{ item.file }}"
        regexp: "/etc/letsencrypt/live/{{ domain }}/"
        replace: "/etc/letsencrypt/live/{{ item.cert }}/"
      loop:
        - { file: 'synkro-kuma', cert: 'status.{{ domain }}' }
        - { file: 'synkro-netdata', cert: 'netdata.{{ domain }}' }
      when: cert_monitoring.stat.exists
      notify: Recharger Nginx

    - name: Installer apache2-utils pour htpasswd
      apt:
        name: apache2-utils
        state: present

    - name: Créer le fichier htpasswd pour le monitoring
      shell: |
        if [ ! -f /etc/nginx/.htpasswd_monitoring ]; then
          htpasswd -cb /etc/nginx/.htpasswd_monitoring admin SynkroMonitor2026!
        fi
      args:
        creates: /etc/nginx/.htpasswd_monitoring

    - name: Tester la config Nginx
      shell: nginx -t
      register: nginx_test
      failed_when: nginx_test.rc != 0

    # ═══════════════════════════════════════════════════════════════════════
    # SYSCTL — Protections réseau
    # ═══════════════════════════════════════════════════════════════════════
    - name: Protections réseau (sysctl)
      sysctl:
        name: "{{ item.key }}"
        value: "{{ item.value }}"
        sysctl_set: yes
        reload: yes
      loop:
        - { key: 'net.ipv4.tcp_syncookies', value: '1' }
        - { key: 'net.ipv4.conf.all.rp_filter', value: '1' }
        - { key: 'net.ipv4.conf.default.rp_filter', value: '1' }
        - { key: 'net.ipv4.icmp_echo_ignore_broadcasts', value: '1' }
        - { key: 'net.ipv4.conf.all.accept_redirects', value: '0' }
        - { key: 'net.ipv4.conf.default.accept_redirects', value: '0' }
        - { key: 'net.ipv4.conf.all.send_redirects', value: '0' }
        - { key: 'net.ipv6.conf.all.accept_redirects', value: '0' }

    # ═══════════════════════════════════════════════════════════════════════
    # RÉSUMÉ
    # ═══════════════════════════════════════════════════════════════════════
    - name: Résumé sécurité & monitoring
      debug:
        msg:
          - "Fail2ban: installé et configuré"
          - "  - SSH: 3 tentatives max, ban 24h"
          - "  - Login API: 5 tentatives max, ban 30min"
          - "  - ModSecurity: 3 blocks max, ban 2h"
          - "ModSecurity: {{ 'actif avec content-types API Platform' if crs_setup.stat.exists else 'non installé' }}"
          - "Rate limiting: login 5r/min, register 3r/min, API 30r/s"
          - "Headers: HSTS, X-Frame-Options, X-Content-Type-Options, X-XSS-Protection, Referrer-Policy, Permissions-Policy"
          - "Réseau: SYN cookies, anti-spoofing, ICMP broadcast ignoré"
          - "Monitoring:"
          - "  - Uptime Kuma: https://status.{{ domain }}"
          - "  - Netdata: https://netdata.{{ domain }}"
          - "  - Auth: admin / SynkroMonitor2026!"

  handlers:
    - name: Redémarrer fail2ban
      systemd:
        name: fail2ban
        state: restarted

    - name: Recharger Nginx
      shell: nginx -t && systemctl reload nginx
