---
# Génération des clés JWT (RSA 4096) si absentes — passphrase lue depuis .env

- name: Créer le répertoire JWT
  file:
    path: "{{ app_dir }}/backend/config/jwt"
    state: directory
    mode: '0755'

- name: Vérifier l'existence de la clé privée JWT
  stat:
    path: "{{ app_dir }}/backend/config/jwt/private.pem"
  register: jwt_private

# La passphrase vient du .env LOCAL via group_vars (jwt_passphrase, lookup ini),
# PAS du .env distant : ce dernier n'existe pas encore au 1er run (il est créé plus
# tard par le rôle app-deploy). Lire le .env distant ici échouait sur un VPS vierge.
- name: Générer la clé privée JWT (avec passphrase)
  shell: >
    openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096
    -aes-256-cbc -pass pass:{{ jwt_passphrase | quote }}
    -out {{ app_dir }}/backend/config/jwt/private.pem
  when:
    - not jwt_private.stat.exists
    - jwt_passphrase | default('') | length > 0

- name: Générer la clé privée JWT (sans passphrase)
  shell: >
    openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096
    -out {{ app_dir }}/backend/config/jwt/private.pem
  when:
    - not jwt_private.stat.exists
    - jwt_passphrase | default('') | length == 0

- name: Générer la clé publique JWT
  shell: >
    openssl rsa
    -in {{ app_dir }}/backend/config/jwt/private.pem
    -pubout -out {{ app_dir }}/backend/config/jwt/public.pem
    {% if jwt_passphrase | default('') | length > 0 %}-passin pass:{{ jwt_passphrase | quote }}{% endif %}
  when: not jwt_private.stat.exists

- name: Re-stat JWT après génération éventuelle
  stat:
    path: "{{ item }}"
  loop:
    - "{{ app_dir }}/backend/config/jwt/private.pem"
    - "{{ app_dir }}/backend/config/jwt/public.pem"
  register: jwt_files_post

- name: Permissions JWT (lecture pour conteneur backend uniquement)
  file:
    path: "{{ item.item }}"
    mode: '0644'
  loop: "{{ jwt_files_post.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.stat.exists
