---
# Installation Docker + daemon hardening (no-new-privileges, log limits, live-restore, etc.)

# Supprime une éventuelle source Docker auto-nommée (sans signed-by) laissée par
# une ancienne install : elle entre en conflit "Signed-By" avec docker.list et
# casse tout `apt update`. Tâche file (pas d'apt) → tourne même si apt est cassé.
- name: Retirer l'ancienne source Docker en conflit (sans signed-by)
  file:
    path: /etc/apt/sources.list.d/download_docker_com_linux_ubuntu.list
    state: absent

- name: Clé GPG officielle Docker
  get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'
    force: no

- name: Repo Docker APT
  apt_repository:
    repo: "deb [arch={{ ansible_architecture | replace('x86_64', 'amd64') | replace('aarch64', 'arm64') }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    filename: docker
    state: present
    update_cache: yes

- name: Installer Docker CE + plugins
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present

- name: Créer /etc/docker
  file:
    path: /etc/docker
    state: directory
    mode: '0755'

- name: Daemon Docker hardening
  copy:
    dest: /etc/docker/daemon.json
    mode: '0644'
    content: |
      {
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "10m",
          "max-file": "5"
        },
        "live-restore": true,
        "userland-proxy": false,
        "no-new-privileges": true,
        "icc": false,
        "default-ulimits": {
          "nofile": { "Name": "nofile", "Hard": 64000, "Soft": 64000 }
        },
        "default-address-pools": [
          { "base": "172.20.0.0/16", "size": 24 }
        ]
      }
  notify: Redémarrer Docker

- name: Activer Docker au boot
  systemd:
    name: docker
    state: started
    enabled: yes

- name: Vérifier que sysadmin est dans le groupe docker (login Docker sans sudo)
  user:
    name: "{{ sysadmin_user }}"
    groups: docker
    append: yes
