---
# ===========================================================================
# Variables globales — toutes les valeurs sensibles viennent du .env local
# (lu via lookup), jamais en dur. Aucun doublon avec les secrets GitHub.
# ===========================================================================

# Application
app_dir: /opt/synkro
backup_dir: /opt/synkro-backups
domain: synkro.ovh
admin_email: "admin@{{ domain }}"
sysadmin_user: sysadmin

# Compose
compose_file: "{{ app_dir }}/docker-compose.prod.yml"
compose_cmd: "docker compose --env-file {{ app_dir }}/.env -f {{ compose_file }}"

# SSH — change le port 22 -> 2222
# Pour fermer le 22 après vérification : ansible-playbook ... -e ssh_close_old_port=true
ssh_port: 2222
ssh_close_old_port: false

# Monitoring (lu depuis .env — ajoute MONITORING_HTPASSWD_PASSWORD à .env.prod)
monitoring_user: admin
monitoring_password: "{{ lookup('ansible.builtin.ini', 'MONITORING_HTPASSWD_PASSWORD type=properties file=' ~ playbook_dir ~ '/../.env default=changeme') }}"

# JWT passphrase — lue depuis le .env
jwt_passphrase: "{{ lookup('ansible.builtin.ini', 'JWT_PASSPHRASE type=properties file=' ~ playbook_dir ~ '/../.env default=') }}"

# Fail2ban — durées
fail2ban_default_bantime: 1h
fail2ban_default_findtime: 10m
fail2ban_default_maxretry: 5
fail2ban_ssh_bantime: 24h
fail2ban_ssh_maxretry: 3

# Ports applicatifs (en localhost via Nginx host)
port_frontend: 8080
port_websocket: 3001
port_kuma: 3100
port_netdata: 9100
port_wazuh: 8443

# ─── Wazuh SIEM ─────────────────────────────────────────────────────────
wazuh_version: "4.9.2"
wazuh_dir: /opt/wazuh-docker
wazuh_indexer_heap: 2g
# Email d'alerte. ENVOI via Brevo (domaine synkro.ovh authentifié dans Brevo via
# DKIM/SPF DNS — n'exige aucune boîte mail OVH). RÉCEPTION sur la boîte Proton
# (seule boîte réellement consultable). from ne marche qu'une fois le domaine
# authentifié dans Brevo ; sinon repasser temporairement à admin.synkro@proton.me.
wazuh_email_from: "alertes@{{ domain }}"
wazuh_email_to: "admin.synkro@proton.me"
wazuh_email_alert_level: 10        # 10 = on n'alerte que sur du sérieux
wazuh_email_maxperhour: 12
# Relais SMTP Brevo (identifiants lus depuis .env — jamais en dur)
brevo_smtp_host: smtp-relay.brevo.com
brevo_smtp_port: 587
brevo_smtp_user: "{{ lookup('ansible.builtin.ini', 'BREVO_SMTP_USER type=properties file=' ~ playbook_dir ~ '/../.env default=') }}"
brevo_smtp_password: "{{ lookup('ansible.builtin.ini', 'BREVO_SMTP_KEY type=properties file=' ~ playbook_dir ~ '/../.env default=') }}"

# ─── Alertes Wazuh via webhook Slack/Discord (remplace l'email) ──────────
# Canal principal des alertes. Hook lu depuis .env (jamais en dur).
# Discord : crée un webhook dans le salon puis AJOUTE "/slack" à la fin de l'URL
#           (ex: https://discord.com/api/webhooks/ID/TOKEN/slack).
# Slack   : "Incoming Webhook" → colle l'URL telle quelle.
wazuh_slack_hook_url: "{{ lookup('ansible.builtin.ini', 'WAZUH_SLACK_HOOK_URL type=properties file=' ~ playbook_dir ~ '/../.env default=') }}"
wazuh_slack_alert_level: 7         # 7 = alertes régulières pour la démo (≥10 = sérieux uniquement ; 5 = encore plus)

# Email désactivé : on utilise le webhook. Repasse à true + renseigne Brevo pour réactiver.
wazuh_email_enabled: false
