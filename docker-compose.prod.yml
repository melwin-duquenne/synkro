services:
  # PHP-FPM (backend applicatif)
  backend-fpm:
    build:
      context: ./backend
      target: prod
    container_name: synkro_backend_fpm
    restart: always
    environment:
      APP_ENV: prod
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-synkro:5432/${POSTGRES_DB}?serverVersion=16&charset=utf8
      JWT_SECRET_KEY: "%kernel.project_dir%/config/jwt/private.pem"
      JWT_PUBLIC_KEY: "%kernel.project_dir%/config/jwt/public.pem"
      JWT_PASSPHRASE: ${JWT_PASSPHRASE}
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      MAILER_DSN: ${MAILER_DSN}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL}
    volumes:
      - backend_public:/var/www/public
    depends_on:
      - postgres-synkro
    networks:
      - synkronet-prod

  # Nginx devant PHP-FPM (nommé backend-synkro pour compatibilité avec frontend nginx.conf)
  backend-synkro:
    image: nginx:1.27-alpine
    container_name: synkro_backend_nginx
    restart: always
    volumes:
      - ./backend/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - backend_public:/var/www/public:ro
    depends_on:
      - backend-fpm
    networks:
      - synkronet-prod

  # Frontend Vue.js (nginx servant le build statique)
  frontend-synkro:
    build:
      context: ./frontend
      target: prod
      args:
        VITE_API_URL: /api
        VITE_WS_URL: ${VITE_WS_URL}
        VITE_BACKEND_URL: ${APP_FRONTEND_URL}
    container_name: synkro_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend-synkro
      - websocket-synkro
    networks:
      - synkronet-prod

  # Serveur WebSocket (Yjs + WebRTC signaling)
  websocket-synkro:
    build:
      context: ./server
      target: prod
    container_name: synkro_websocket
    restart: always
    environment:
      NODE_ENV: production
      PORT: "3001"
    networks:
      - synkronet-prod

  # Base de données PostgreSQL
  postgres-synkro:
    image: postgres:16
    container_name: synkro_postgres_prod
    restart: always
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    networks:
      - synkronet-prod

volumes:
  postgres_data_prod:
  backend_public:

networks:
  synkronet-prod:
    driver: bridge
