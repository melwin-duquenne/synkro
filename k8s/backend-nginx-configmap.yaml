apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-nginx-config
  namespace: synkro
data:
  dotenv: |
    APP_ENV=prod
  default.conf: |
    server {
        listen 8000;
        server_name _;
        root /var/www/public;
        index index.php;

        location / {
            try_files $uri /index.php$is_args$args;
        }

        location ~ ^/index\.php(/|$) {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_split_path_info ^(.+\.php)(/.*)$;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $realpath_root;
            internal;
        }

        location /uploads/ {
            alias /var/www/public/uploads/;
        }

        location ~ \.php$ {
            return 404;
        }
    }
