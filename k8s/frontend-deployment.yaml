apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-synkro
  namespace: synkro
spec:
  replicas: 3
  selector:
    matchLabels:
      app: frontend-synkro
  template:
    metadata:
      labels:
        app: frontend-synkro
    spec:
      containers:
        - name: frontend
          image: moignon/synkro-frontend:latest
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: nginx-config
          configMap:
            name: frontend-nginx-config
