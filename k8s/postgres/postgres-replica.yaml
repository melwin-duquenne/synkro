# StatefulSet pour le nœud replica PostgreSQL (lecture seule, réplication streaming depuis le primaire)
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-replica
  namespace: synkro
spec:
  serviceName: postgres-replica
  replicas: 1
  selector:
    matchLabels:
      app: postgres-replica
  template:
    metadata:
      labels:
        app: postgres-replica
    spec:
      initContainers:
        # Clone le primaire via pg_basebackup avant le premier démarrage pour initialiser les données
        - name: clone-primary
          image: postgres:16
          command:
            - bash
            - -c
            - |
              # Skip if already initialized
              if [ -f /var/lib/postgresql/data/pgdata/PG_VERSION ]; then
                echo "Replica already initialized, skipping."
                exit 0
              fi
              echo "Cloning primary..."
              # -Fp : format plain, -Xs : inclut les WAL dans la sauvegarde, -R : génère le fichier standby.signal
              PGPASSWORD="${REPLICATION_PASSWORD}" pg_basebackup \
                -h postgres-synkro \
                -U replicator \
                -D /var/lib/postgresql/data/pgdata \
                -Fp -Xs -R -P
              echo "Clone complete."
          env:
            - name: REPLICATION_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: synkro-secrets
                  key: REPLICATION_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-replica-storage
              mountPath: /var/lib/postgresql/data

      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: synkro-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: synkro-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: synkro-secrets
                  key: POSTGRES_DB
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-replica-storage
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          # Délai plus long que le primaire (15s) pour laisser le temps à pg_basebackup de finir
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "$(POSTGRES_USER)"]
            initialDelaySeconds: 15
            periodSeconds: 10

  # volumeClaimTemplates crée automatiquement un PVC par replica — garantit un stockage isolé et stable
  volumeClaimTemplates:
    - metadata:
        name: postgres-replica-storage
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
# Service interne pour les lectures en lecture seule depuis le replica (décongestionne le primaire)
apiVersion: v1
kind: Service
metadata:
  name: postgres-replica
  namespace: synkro
spec:
  selector:
    app: postgres-replica
  ports:
    - port: 5432
      targetPort: 5432
