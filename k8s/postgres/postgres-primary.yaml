apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-primary
  namespace: synkro
spec:
  serviceName: postgres-primary
  replicas: 1
  selector:
    matchLabels:
      app: postgres-primary
  template:
    metadata:
      labels:
        app: postgres-primary
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: synkro-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: synkro-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: synkro-secrets
                  key: POSTGRES_DB
            - name: REPLICATION_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: synkro-secrets
                  key: REPLICATION_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
          args:
            - postgres
            - -c
            - wal_level=replica
            - -c
            - max_wal_senders=3
            - -c
            - wal_keep_size=64
            - -c
            - hot_standby=on
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "$(POSTGRES_USER)"]
            initialDelaySeconds: 10
            periodSeconds: 10

      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-data
        - name: init-scripts
          configMap:
            name: postgres-config
            defaultMode: 0755
            items:
              - key: init-replication.sh
                path: init-replication.sh
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-synkro
  namespace: synkro
spec:
  selector:
    app: postgres-primary
  ports:
    - port: 5432
      targetPort: 5432
