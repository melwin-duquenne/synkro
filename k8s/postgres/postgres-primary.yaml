# StatefulSet pour le nœud primaire PostgreSQL (lectures + écritures)
# StatefulSet garantit un nom de pod stable et un PVC dédié, essentiel pour les bases de données
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-primary
  namespace: synkro
spec:
  serviceName: postgres-primary
  # 1 seul primaire : PostgreSQL ne supporte pas le multi-master nativement
  replicas: 1
  selector:
    matchLabels:
      app: postgres-primary
  template:
    metadata:
      labels:
        app: postgres-primary
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: synkro-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: synkro-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: synkro-secrets
                  key: POSTGRES_DB
            # Transmis au script init-replication.sh pour créer le rôle replicator
            - name: REPLICATION_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: synkro-secrets
                  key: REPLICATION_PASSWORD
            # Sous-répertoire explicite pour éviter les conflits avec le point de montage parent
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
            # Les scripts dans ce répertoire sont exécutés automatiquement à la première initialisation
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
          # Active la réplication WAL via les arguments de démarrage du processus postgres
          args:
            - postgres
            - -c
            - wal_level=replica
            - -c
            - max_wal_senders=3
            - -c
            - wal_keep_size=64
            - -c
            - hot_standby=on
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          # Vérifie que PostgreSQL accepte des connexions avant de marquer le pod prêt
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "$(POSTGRES_USER)"]
            initialDelaySeconds: 10
            periodSeconds: 10

      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-data
        # Script d'initialisation de la réplication monté avec les droits d'exécution (0755)
        - name: init-scripts
          configMap:
            name: postgres-config
            defaultMode: 0755
            items:
              - key: init-replication.sh
                path: init-replication.sh
---
# Service qui expose le primaire PostgreSQL sous le nom stable "postgres-synkro" utilisé par le backend
apiVersion: v1
kind: Service
metadata:
  name: postgres-synkro
  namespace: synkro
spec:
  selector:
    app: postgres-primary
  ports:
    - port: 5432
      targetPort: 5432
