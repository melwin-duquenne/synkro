apiVersion: apps/v1
kind: Deployment
metadata:
  name: websocket-synkro
  namespace: synkro
spec:
  replicas: 1
  selector:
    matchLabels:
      app: websocket-synkro
  template:
    metadata:
      labels:
        app: websocket-synkro
    spec:
      containers:
        - name: websocket
          image: moignon/synkro-websocket:latest
          ports:
            - containerPort: 3001
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3001"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
