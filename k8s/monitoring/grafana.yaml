# ─────────────────────────────────────────────────────────────
# PVC
# ─────────────────────────────────────────────────────────────
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  namespace: synkro
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
# ─────────────────────────────────────────────────────────────
# ConfigMap — datasource auto-provision
# ─────────────────────────────────────────────────────────────
# Provisionne automatiquement Prometheus comme datasource au démarrage de Grafana
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: synkro
data:
  prometheus.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        # UID stable référencé dans les dashboards pour éviter les liens cassés après recréation
        uid: prometheus-synkro
        type: prometheus
        url: http://prometheus.synkro.svc.cluster.local:9090
        isDefault: true
        # access: proxy = Grafana appelle Prometheus côté serveur (pas depuis le navigateur)
        access: proxy
        # editable: false empêche la modification accidentelle de la datasource depuis l'UI
        editable: false
---
# ─────────────────────────────────────────────────────────────
# Deployment
# ─────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: synkro
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      # UID 472 est l'utilisateur grafana dans l'image officielle — fsGroup permet l'accès en écriture au PVC
      securityContext:
        fsGroup: 472
        runAsUser: 472
        runAsNonRoot: true
      containers:
        - name: grafana
          image: grafana/grafana:10.4.0
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: synkro-secrets
                  key: GRAFANA_ADMIN_USER
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: synkro-secrets
                  key: GRAFANA_ADMIN_PASSWORD
            # Indique à Grafana où trouver les fichiers de provisioning (datasources, dashboards)
            - name: GF_PATHS_PROVISIONING
              value: /etc/grafana/provisioning
          volumeMounts:
            - name: storage
              mountPath: /var/lib/grafana
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboard-json
              mountPath: /etc/grafana/provisioning/dashboards/json
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: grafana-data
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: dashboard-json
          configMap:
            name: grafana-dashboard-synkro
---
# ─────────────────────────────────────────────────────────────
# Service — NodePort pour accès externe
# ─────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: synkro
spec:
  type: LoadBalancer
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
