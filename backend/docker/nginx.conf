server {
    listen 8000;
    server_name _;
    root /var/www/public;
    index index.php;

    # DNS interne de Docker : re-résout l'upstream à chaque requête au lieu de
    # figer l'IP au démarrage. Évite les 502 quand backend-fpm est recréé avec
    # une nouvelle IP (déploiement ansible OU auto-update Watchtower).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Proxy les requêtes vers PHP-FPM
    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        # Passer l'upstream via une variable FORCE nginx à utiliser le resolver
        # ci-dessus. Avec un nom littéral, l'IP serait résolue une seule fois
        # au chargement de la conf puis figée -> 502 après recréation du FPM.
        set $fpm_upstream backend-fpm:9000;
        fastcgi_pass $fpm_upstream;
        internal;
    }

    # Servir les fichiers uploadés directement
    location /uploads/ {
        alias /var/www/public/uploads/;
    }

    # Bloquer l'accès direct aux .php (sauf index.php)
    location ~ \.php$ {
        return 404;
    }
}
