name: Build, Push & Deploy Synkro

on:
  push:
    branches: [ "main", "calista" ]

jobs:
  # ─── BUILD BACKEND ─────────────────────────────────────────────────────────
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: prod
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/synkro-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/synkro-backend:${{ github.sha }}
          no-cache: true
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  # ─── BUILD WEBSOCKET ───────────────────────────────────────────────────────
  build-websocket:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push WebSocket
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          target: prod
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/synkro-websocket:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/synkro-websocket:${{ github.sha }}
          cache-from: type=gha,scope=websocket
          cache-to: type=gha,mode=max,scope=websocket

  # ─── BUILD FRONTEND ────────────────────────────────────────────────────────
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          target: prod
          push: true
          provenance: false
          sbom: false
          build-args: |
            VITE_API_URL=/api
            VITE_WS_URL=${{ secrets.VITE_WS_URL }}
            VITE_BACKEND_URL=${{ secrets.APP_FRONTEND_URL }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/synkro-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/synkro-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # ─── DEPLOY SUR VPS ────────────────────────────────────────────────────────
  deploy:
    runs-on: ubuntu-latest
    needs: [build-backend, build-websocket, build-frontend]  # Attend que les 3 builds soient OK
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer Ansible
        run: |
          sudo apt-get update -q
          sudo apt-get install -y ansible

      - name: Configurer la clé SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Générer le fichier .env depuis les secrets et variables GitHub
        env:
          APP_SECRET: ${{ secrets.APP_SECRET }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          JWT_PASSPHRASE: ${{ secrets.JWT_PASSPHRASE }}
          CORS_ALLOW_ORIGIN: ${{ secrets.CORS_ALLOW_ORIGIN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REDIRECT_URI: ${{ secrets.GOOGLE_REDIRECT_URI }}
          MAILER_DSN: ${{ secrets.MAILER_DSN }}
          APP_FRONTEND_URL: ${{ secrets.APP_FRONTEND_URL }}
          VITE_WS_URL: ${{ secrets.VITE_WS_URL }}
          DEFAULT_URI: ${{ secrets.DEFAULT_URI }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          cat > .env <<ENVEOF
          DOCKERHUB_USERNAME=${DOCKERHUB_USERNAME}
          NODE_ENV=${{ vars.NODE_ENV }}
          APP_ENV=prod
          APP_SECRET=${APP_SECRET}
          POSTGRES_USER=${POSTGRES_USER}
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          POSTGRES_DB=${POSTGRES_DB}
          DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-synkro:5432/${POSTGRES_DB}?serverVersion=16&charset=utf8
          JWT_SECRET_KEY=%kernel.project_dir%/config/jwt/private.pem
          JWT_PUBLIC_KEY=%kernel.project_dir%/config/jwt/public.pem
          JWT_PASSPHRASE=${JWT_PASSPHRASE}
          CORS_ALLOW_ORIGIN=${CORS_ALLOW_ORIGIN}
          GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
          GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
          GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}
          MAILER_DSN=${MAILER_DSN}
          APP_FRONTEND_URL=${APP_FRONTEND_URL}
          VITE_WS_URL=${VITE_WS_URL}
          VITE_API_URL=/api
          VITE_BACKEND_TARGET=http://backend-synkro:8000
          VITE_BACKEND_URL=http://backend-synkro:8000
          DEFAULT_URI=${DEFAULT_URI}
          PORT=${{ vars.PORT }}
          PORT_BACKEND=${{ vars.PORT_BACKEND }}
          PORT_FRONTEND=${{ vars.PORT_FRONTEND }}
          PORT_POSTGRES=${{ vars.PORT_POSTGRES }}
          PORT_POSTGRES_2=${{ vars.PORT_POSTGRES_2 }}
          PORT_WEBSOCKET=${{ vars.PORT_WEBSOCKET }}
          BASE_URL=/
          ENVEOF
          sed -i 's/^          //' .env

      - name: Générer l'inventory Ansible
        run: |
          cat > ansible/inventory.ini << EOF
          [vps]
          ${{ secrets.VPS_HOST }} ansible_user=${{ secrets.VPS_USER }} ansible_ssh_private_key_file=~/.ssh/id_rsa ansible_become=yes ansible_become_method=sudo
          EOF

      - name: Lancer le playbook Ansible
        run: |
          ansible-playbook ansible/deploy.yml -i ansible/inventory.ini