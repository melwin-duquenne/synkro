services:
  backend-fpm:
    image: moignon/synkro-backend:latest
    container_name: synkro_backend_fpm
    restart: always
    environment:
      APP_ENV: prod
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-synkro:5432/${POSTGRES_DB}?serverVersion=16&charset=utf8
      JWT_SECRET_KEY: "%kernel.project_dir%/config/jwt/private.pem"
      JWT_PUBLIC_KEY: "%kernel.project_dir%/config/jwt/public.pem"
      JWT_PASSPHRASE: ${JWT_PASSPHRASE}
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      MAILER_DSN: ${MAILER_DSN}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL}
    volumes:
      - backend_public:/var/www/public
      - ./backend/config/jwt:/var/www/config/jwt:ro
      - ./.env:/var/www/.env:ro
    depends_on:
      - postgres-synkro
    networks:
      - synkronet-prod

  backend-synkro:
    image: nginx:1.27-alpine
    container_name: synkro_backend_nginx
    restart: always
    volumes:
      - ./backend/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - backend_public:/var/www/public:ro
    depends_on:
      - backend-fpm
    networks:
      - synkronet-prod

  frontend-synkro:
    image: moignon/synkro-frontend:latest
    container_name: synkro_frontend
    restart: always
    ports:
      - "${PORT_FRONTEND:-8080:80}"
    depends_on:
      - backend-synkro
      - websocket-synkro
    networks:
      - synkronet-prod

  websocket-synkro:
    image: moignon/synkro-websocket:latest
    container_name: synkro_websocket
    restart: always
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: "3001"
    networks:
      - synkronet-prod

  postgres-synkro:
    image: postgres:16
    container_name: synkro_postgres_prod
    restart: always
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    networks:
      - synkronet-prod

  # ─── MONITORING ──────────────────────────────────────────────────────────
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: synkro_uptime_kuma
    restart: always
    ports:
      - "127.0.0.1:3100:3001"
    volumes:
      - uptime_kuma_data:/app/data
    networks:
      - synkronet-prod

  netdata:
    image: netdata/netdata:stable
    container_name: synkro_netdata
    restart: always
    ports:
      - "127.0.0.1:9100:19999"
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    volumes:
      - netdata_config:/etc/netdata
      - netdata_lib:/var/lib/netdata
      - netdata_cache:/var/cache/netdata
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - NETDATA_CLAIM_TOKEN=
      - DOCKER_HOST=unix:///var/run/docker.sock
    networks:
      - synkronet-prod

volumes:
  postgres_data_prod:
  backend_public:
  uptime_kuma_data:
  netdata_config:
  netdata_lib:
  netdata_cache:

networks:
  synkronet-prod:
    driver: bridge