server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript;

    # Ne jamais mettre en cache le point d'entrée HTML
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Assets Vite avec hash : cache permanent
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Proxy API Symfony
    location /api/ {
        proxy_pass http://backend-synkro:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy uploads Symfony
    location /uploads/ {
        proxy_pass http://backend-synkro:8000/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy OAuth Google (backend redirige vers /auth/google)
    location /auth/ {
        proxy_pass http://backend-synkro:8000/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy WebSocket Yjs
    location /ws {
        proxy_pass http://websocket-synkro:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # Vue Router history mode
    location / {
        try_files $uri $uri/ /index.html;
    }
}
