# Préserve le protocole d'origine transmis par le reverse proxy hôte
# (X-Forwarded-Proto: https). En dev (accès direct http sans en-tête amont),
# on retombe sur $scheme. Sans ça, $scheme=http écrase le https du proxy et
# Symfony génère des redirect_uri OAuth en http:// (redirect_uri_mismatch).
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # DNS interne de Docker : re-résout les upstreams à chaque requête au lieu
    # de figer l'IP au démarrage. Évite les 502 quand backend-synkro est recréé
    # avec une nouvelle IP (déploiement ansible OU auto-update Watchtower).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Assets statiques avec cache long
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA : toutes les routes renvoient index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # OAuth Symfony hors préfixe /api — UNIQUEMENT les endpoints backend
    # /auth/google*. Les autres routes /auth/* (ex. /auth/callback qui reçoit le
    # token) sont des routes du SPA Vue : elles doivent retomber sur index.html
    # via `location /`, pas être proxyfiées au backend (sinon 404 Symfony).
    location /auth/google {
        set $backend_upstream backend-synkro:8000;
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Proxy vers le backend Symfony (PHP-FPM via nginx interne)
    location /api/ {
        set $backend_upstream backend-synkro:8000;
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Proxy WebSocket
    location /ws/ {
        proxy_pass http://websocket-synkro:3001/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}
